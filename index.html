<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB MANAGEMENT & MEDIA PLATFORM</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        club: { dark: '#0f172a', card: '#1e293b', accent: '#10b981', gold: '#f59e0b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-club-dark text-slate-100 font-sans antialiased min-h-screen">

    <!-- ナビゲーションバー -->
    <nav class="bg-club-card border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">⚽</span>
                    <span class="font-bold text-lg tracking-wider text-club-accent">CLUB PORTAL</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="switchTab('fan')" id="btn-fan" class="px-4 py-2 rounded-lg text-sm font-medium bg-club-accent text-slate-900 transition">ファンサイト</button>
                    <button onclick="switchTab('admin')" id="btn-admin" class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition">管理者ダッシュボード</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- ==================== ファンサイトビュー ==================== -->
        <div id="view-fan" class="space-y-8">
            <!-- ヒーロー / 次節情報 -->
            <div class="bg-gradient-to-r from-emerald-900 to-club-card rounded-2xl p-6 border border-emerald-500/30 shadow-xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1 rounded-full font-semibold">NEXT MATCH</span>
                    <span class="text-xs text-slate-400">2026.11.15 (Sat) 14:00 KO</span>
                </div>
                <div class="flex justify-around items-center text-center">
                    <div>
                        <p class="text-2xl font-black">KYOTO</p>
                        <p class="text-xs text-slate-400">HOME</p>
                    </div>
                    <div class="text-xl font-bold text-club-gold">VS</div>
                    <div>
                        <p class="text-2xl font-black">VISSEL KOBE</p>
                        <p class="text-xs text-slate-400">AWAY</p>
                    </div>
                </div>
            </div>

            <!-- 公式風スタメン＆ベンチ発表 -->
            <div class="bg-club-card rounded-2xl p-6 border border-slate-800">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold flex items-center gap-2"><span>🛡️</span> フォーメーション (3-4-2-1)</h2>
                    <span class="text-xs text-slate-400">最新マッチ設定</span>
                </div>
                <!-- ピッチグラフィック -->
                <div class="relative bg-emerald-900/40 border border-emerald-600/30 rounded-xl p-6 h-[440px] flex flex-col justify-between items-center overflow-hidden mb-6">
                    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-emerald-800/20 via-transparent to-black/40 pointer-events-none"></div>
                    
                    <!-- FW -->
                    <div class="w-full flex justify-center z-10" id="pos-fw"></div>
                    <!-- OM -->
                    <div class="w-full flex justify-around z-10" id="pos-om"></div>
                    <!-- MF -->
                    <div class="w-full flex justify-around z-10" id="pos-mf"></div>
                    <!-- DF -->
                    <div class="w-full flex justify-around z-10" id="pos-df"></div>
                    <!-- GK -->
                    <div class="w-full flex justify-center z-10" id="pos-gk"></div>
                </div>

                <!-- ベンチメンバー表示 -->
                <div>
                    <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2"><span>🪑</span> SUB (ベンチメンバー)</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-5 gap-2" id="bench-list-container">
                        <!-- 動的生成 -->
                    </div>
                </div>
            </div>

            <!-- 試合結果履歴 (Match History) -->
            <div class="bg-club-card rounded-2xl p-6 border border-slate-800">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><span>📊</span> 試合結果・スコア履歴 (Match History)</h2>
                <div class="space-y-3" id="match-history-container">
                    <!-- 動的生成 -->
                </div>
            </div>

            <!-- 選手名鑑 (FotMob & エルゴラッソ風) -->
            <div class="bg-club-card rounded-2xl p-6 border border-slate-800">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2"><span>👥</span> 登録選手一覧 & スタッツ</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="player-list-container">
                    <!-- 動的生成 -->
                </div>
            </div>
        </div>

        <!-- ==================== 管理者ダッシュボード ==================== -->
        <div id="view-admin" class="space-y-8 hidden">
            <div class="bg-club-card rounded-2xl p-6 border border-slate-800">
                <h2 class="text-xl font-bold mb-2 text-club-accent">📝 試合結果 & 詳細記録入力</h2>
                <p class="text-sm text-slate-400 mb-6">試合ごとのスコアやスタメン・ベンチ・得点時間を記録します。</p>

                <form id="match-form" onsubmit="handleMatchSubmit(event)" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">対戦相手</label>
                            <input type="text" id="input-opponent" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-club-accent" placeholder="例: 浦和レッズ">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">京都 (自チーム) 得点</label>
                            <input type="number" id="input-myscore" min="0" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-club-accent">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">相手チーム 得点</label>
                            <input type="number" id="input-oppscore" min="0" value="0" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-club-accent">
                        </div>
                    </div>

                    <!-- 得点記録セクション -->
                    <div class="border-t border-slate-800 pt-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-sm font-bold text-club-accent">⚽ 得点・アシスト詳細</label>
                            <button type="button" onclick="addGoalField()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded transition">+ 得点を追加</button>
                        </div>
                        <div id="goals-container" class="space-y-3">
                            <!-- 動的行 -->
                        </div>
                    </div>

                    <!-- スタメン編成セクション -->
                    <div class="border-t border-slate-800 pt-4">
                        <label class="block text-sm font-bold text-club-accent mb-3">🛡️ スタメン編成 (3-4-2-1)</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="lineup-selectors">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                    <!-- ベンチメンバー編成セクション -->
                    <div class="border-t border-slate-800 pt-4">
                        <label class="block text-sm font-bold text-club-accent mb-3">🪑 ベンチメンバー編成 (5名)</label>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="bench-selectors">
                            <!-- 動的生成 -->
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-club-accent text-slate-900 font-bold py-3 rounded-lg hover:bg-emerald-400 transition shadow-lg">
                        試合を記録してアーカイブに追加
                    </button>
                </form>
            </div>
        </div>

    </main>

    <script>
        // デフォルト選手マスターデータ
        const defaultPlayers = [
            { id: 1, name: "太田 岳志", number: 1, pos: "GK", goals: 0, assists: 0, catchphrase: "不屈の守護神。抜群のコーチングで最終ラインを引き締め続けるベテラン。" },
            { id: 2, name: "麻田 将吾", number: 2, pos: "DF", goals: 1, assists: 0, catchphrase: "対人守備の強さと正確な左足のフィードが売りのレフティセンターバック。" },
            { id: 3, name: "鈴木 冬一", number: 3, pos: "DF", goals: 0, assists: 2, catchphrase: "豊富な運動量でサイドを駆け上がるアグレッシブなサイドアタッカー。" },
            { id: 4, name: "井上 黎生人", number: 4, pos: "DF", goals: 0, assists: 0, catchphrase: "危機察知能力に優れ、粘り強いタックルでピンチを防ぐファイター。" },
            { id: 5, name: "川﨑 颯太", number: 7, pos: "MF", goals: 3, assists: 4, catchphrase: "ユース出身の心臓。圧倒的な走力と球際への強さで中盤を支配するアカデミーの誇り。" },
            { id: 6, name: "金子 大毅", number: 6, pos: "MF", goals: 1, assists: 2, catchphrase: "広範な視野と正確なボール捌きでゲームをコントロールする職人。" },
            { id: 7, name: "平賀 大空", number: 14, pos: "MF", goals: 2, assists: 1, catchphrase: "キレのあるドリブルで局面を打開する若きサイドアタッカー。" },
            { id: 8, name: "福岡 慎平", number: 8, pos: "MF", goals: 2, assists: 3, catchphrase: "卓越した戦術眼と神出鬼没の飛び出しでゴールを狙うマルチプレイヤー。" },
            { id: 9, name: "原 大智", number: 9, pos: "FW", goals: 8, assists: 2, catchphrase: "前線のターゲットマン。圧倒的な高さとポストプレーで攻撃の起点となるエース。" },
            { id: 10, name: "宮吉 拓実", number: 13, pos: "FW", goals: 2, assists: 1, catchphrase: "巧みなポジショニングと一瞬の閃きで相手網を切り裂く経験豊富なアタッカー。" },
            { id: 11, name: "豊川 雄太", number: 23, pos: "FW", goals: 5, assists: 1, catchphrase: "ゴールへの強烈な執念と裏抜けのスピードで相手DFを脅かすストライカー。" },
            { id: 12, name: "ク ルイスイメリ", number: 16, pos: "MF", goals: 1, assists: 1, catchphrase: "卓越したテクニックとパスセンスで攻撃にリズムを生み出す起爆剤。" },
            { id: 13, name: "佐藤 響", number: 24, pos: "DF", goals: 0, assists: 1, catchphrase: "圧倒的なスプリント力でサイドを切り裂くアグレッシブな側面王。" }
        ];

        // 初期スタメン＆ベンチ設定
        let currentLineup = {
            fw: 9,
            om1: 8, om2: 10,
            mf1: 5, mf2: 6, mf3: 3, mf4: 7,
            df1: 2, df2: 4, df3: 11,
            gk: 1
        };
        let currentBench = [12, 13, 3, 4, 1]; // ベンチメンバーのID配列

        // 初期試合履歴データ
        const defaultHistory = [
            { opponent: "ガンバ大阪", myScore: 2, oppScore: 1, result: "WIN", date: "2026.11.02", goals: [{scorer: "原 大智", time: "18分"}, {scorer: "川﨑 颯太", time: "74分"}] }
        ];

        // LocalStorage読み込み
        let players = JSON.parse(localStorage.getItem('club_players')) || defaultPlayers;
        let lineup = JSON.parse(localStorage.getItem('club_lineup')) || currentLineup;
        let bench = JSON.parse(localStorage.getItem('club_bench')) || currentBench;
        let matchHistory = JSON.parse(localStorage.getItem('club_history')) || defaultHistory;

        // タブ切り替え
        function switchTab(tab) {
            const fanView = document.getElementById('view-fan');
            const adminView = document.getElementById('view-admin');
            const btnFan = document.getElementById('btn-fan');
            const btnAdmin = document.getElementById('btn-admin');

            if (tab === 'fan') {
                fanView.classList.remove('hidden');
                adminView.classList.add('hidden');
                btnFan.className = "px-4 py-2 rounded-lg text-sm font-medium bg-club-accent text-slate-900 transition";
                btnAdmin.className = "px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition";
                renderFanSite();
            } else {
                fanView.classList.add('hidden');
                adminView.classList.remove('hidden');
                btnAdmin.className = "px-4 py-2 rounded-lg text-sm font-medium bg-club-accent text-slate-900 transition";
                btnFan.className = "px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white transition";
                renderAdminForm();
            }
        }

        // ファンサイト描画
        function renderFanSite() {
            // スタメン配置
            renderPositionSlot('pos-fw', [lineup.fw]);
            renderPositionSlot('pos-om', [lineup.om1, lineup.om2]);
            renderPositionSlot('pos-mf', [lineup.mf1, lineup.mf2, lineup.mf3, lineup.mf4]);
            renderPositionSlot('pos-df', [lineup.df1, lineup.df2, lineup.df3]);
            renderPositionSlot('pos-gk', [lineup.gk]);

            // ベンチメンバー描画
            const benchContainer = document.getElementById('bench-list-container');
            benchContainer.innerHTML = '';
            bench.forEach(id => {
                const p = players.find(x => x.id === Number(id));
                if (p) {
                    benchContainer.innerHTML += `
                        <div class="bg-slate-900/80 border border-slate-700/60 p-2 rounded-lg text-center">
                            <span class="text-[10px] text-club-accent font-bold">#${p.number} (${p.pos})</span>
                            <p class="text-xs font-bold text-white truncate">${p.name}</p>
                        </div>
                    `;
                }
            });

            // 試合履歴描画
            const historyContainer = document.getElementById('match-history-container');
            historyContainer.innerHTML = '';
            matchHistory.forEach(m => {
                let badgeColor = m.result === 'WIN' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : (m.result === 'DRAW' ? 'bg-amber-500/20 text-amber-400 border-amber-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30');
                let goalsHtml = m.goals.map(g => `<span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-slate-300">⚽ ${g.scorer} (${g.time})</span>`).join(' ');

                historyContainer.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-xs px-2.5 py-1 rounded-full font-bold border ${badgeColor}">${m.result}</span>
                            <div>
                                <p class="text-sm font-bold text-white">vs ${m.opponent} <span class="text-club-gold text-base ml-2">${m.myScore} - ${m.oppScore}</span></p>
                                <p class="text-[10px] text-slate-400">${m.date}</p>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-1">${goalsHtml || '<span class="text-xs text-slate-500">得点なし</span>'}</div>
                    </div>
                `;
            });

            // 選手一覧・名鑑
            const container = document.getElementById('player-list-container');
            container.innerHTML = '';
            players.forEach(p => {
                container.innerHTML += `
                    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-club-accent/20 text-club-accent text-xs font-bold px-2 py-0.5 rounded">#${p.number} ${p.pos}</span>
                                <div class="text-right text-xs text-slate-400">
                                    <span>⚽ ${p.goals}G</span> / <span>${p.assists}A</span>
                                </div>
                            </div>
                            <h3 class="font-bold text-base mb-1">${p.name}</h3>
                            <p class="text-xs text-slate-300 italic bg-slate-800/50 p-2 rounded border-l-2 border-club-accent mb-3">「${p.catchphrase}」</p>
                        </div>
                        <div class="text-[10px] text-slate-400 flex justify-between border-t border-slate-800 pt-2">
                            <span>レイティング: 7.24</span>
                            <span class="text-emerald-400">好調</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderPositionSlot(elementId, pIds) {
            const el = document.getElementById(elementId);
            el.innerHTML = '';
            pIds.forEach(id => {
                const p = players.find(x => x.id === Number(id));
                if (p) {
                    el.innerHTML += `
                        <div class="bg-slate-900/90 border border-emerald-500/40 px-3 py-1.5 rounded-lg text-center shadow">
                            <span class="text-[10px] text-club-accent block font-bold">#${p.number}</span>
                            <span class="text-xs font-bold text-white">${p.name.split(' ')[0]}</span>
                        </div>
                    `;
                }
            });
        }

        // 管理者フォーム描画
        function renderAdminForm() {
            const container = document.getElementById('lineup-selectors');
            container.innerHTML = '';
            const positions = [
                { key: 'fw', label: 'FW (1トップ)' },
                { key: 'om1', label: 'OM (シャドー左)' }, { key: 'om2', label: 'OM (シャドー右)' },
                { key: 'mf1', label: 'MF (WB左)' }, { key: 'mf2', label: 'MF (ボランチ左)' }, { key: 'mf3', label: 'MF (ボランチ右)' }, { key: 'mf4', label: 'MF (WB右)' },
                { key: 'df1', label: 'DF (CB左)' }, { key: 'df2', label: 'DF (CB中央)' }, { key: 'df3', label: 'DF (CB右)' },
                { key: 'gk', label: 'GK (ゴールキーパー)' }
            ];

            positions.forEach(pos => {
                let options = players.map(p => `<option value="${p.id}" ${lineup[pos.key] == p.id ? 'selected' : ''}>#${p.number} ${p.name} (${p.pos})</option>`).join('');
                container.innerHTML += `
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">${pos.label}</label>
                        <select name="pos_${pos.key}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
                            ${options}
                        </select>
                    </div>
                `;
            });

            // ベンチメンバー選択枠 (5枠)
            const benchContainer = document.getElementById('bench-selectors');
            benchContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                let options = players.map(p => `<option value="${p.id}" ${bench[i] == p.id ? 'selected' : ''}>#${p.number} ${p.name} (${p.pos})</option>`).join('');
                benchContainer.innerHTML += `
                    <div>
                        <label class="block text-[11px] text-slate-400 mb-1">ベンチ枠 #${i+1}</label>
                        <select name="bench_${i}" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
                            ${options}
                        </select>
                    </div>
                `;
            }
        }

        // 得点追加フィールド
        function addGoalField() {
            const container = document.getElementById('goals-container');
            let options = players.map(p => `<option value="${p.name}">#${p.number} ${p.name}</option>`).join('');
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center bg-slate-900/50 p-2 rounded border border-slate-800";
            div.innerHTML = `
                <select class="goal-scorer bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-white flex-1">${options}</select>
                <input type="text" placeholder="例: 34分" class="goal-time bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs w-24 text-center text-white">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-300 text-xs px-2">✕</button>
            `;
            container.appendChild(div);
        }

        // フォーム送信処理
        function handleMatchSubmit(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const opponent = document.getElementById('input-opponent').value;
            const myScore = Number(document.getElementById('input-myscore').value);
            const oppScore = Number(document.getElementById('input-oppscore').value);

            let result = 'DRAW';
            if (myScore > oppScore) result = 'WIN';
            else if (myScore < oppScore) result = 'LOSE';

            // スタメン更新
            lineup.fw = formData.get('pos_fw');
            lineup.om1 = formData.get('pos_om1');
            lineup.om2 = formData.get('pos_om2');
            lineup.mf1 = formData.get('pos_mf1');
            lineup.mf2 = formData.get('pos_mf2');
            lineup.mf3 = formData.get('pos_mf3');
            lineup.mf4 = formData.get('pos_mf4');
            lineup.df1 = formData.get('pos_df1');
            lineup.df2 = formData.get('pos_df2');
            lineup.df3 = formData.get('pos_df3');
            lineup.gk = formData.get('pos_gk');

            // ベンチ更新
            bench = [];
            for (let i = 0; i < 5; i++) {
                bench.push(formData.get(`bench_${i}`));
            }

            // 得点者の集計と記録作成
            const scorers = document.querySelectorAll('.goal-scorer');
            const times = document.querySelectorAll('.goal-time');
            let goalRecords = [];

            scorers.forEach((s, idx) => {
                const sName = s.value;
                const timeStr = times[idx].value || '0分';
                goalRecords.push({ scorer: sName, time: timeStr });

                // 選手データのゴール数をインクリメント
                const pObj = players.find(p => p.name === sName);
                if (pObj) pObj.goals += 1;
            });

            // マッチ履歴に追加
            const today = new Date().toISOString().split('T')[0].replace(/-/g, '.');
            matchHistory.unshift({
                opponent: opponent,
                myScore: myScore,
                oppScore: oppScore,
                result: result,
                date: today,
                goals: goalRecords
            });

            // LocalStorageに保存
            localStorage.setItem('club_players', JSON.stringify(players));
            localStorage.setItem('club_lineup', JSON.stringify(lineup));
            localStorage.setItem('club_bench', JSON.stringify(bench));
            localStorage.setItem('club_history', JSON.stringify(matchHistory));

            alert('試合結果を記録し、履歴と個人成績を更新しました！');
            switchTab('fan');
        }

        // 初期描画
        renderFanSite();
    </script>
